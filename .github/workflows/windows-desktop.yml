name: Windows source smoke
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create project virtual environment and install dependencies
        shell: pwsh
        run: |
          py -3.11 -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          npm ci
      - name: Check PowerShell-oriented Python entry points
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m vfxai.dev --help
          & .\.venv\Scripts\python.exe -m vfxai.server --help
          & .\.venv\Scripts\python.exe -m vfxai.cli init
      - name: Run Python and JavaScript tests and build
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m unittest discover -s tests-python -v
          npm test
          npm run build
      - name: Smoke-test actual training and held-out evaluation
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m vfxai.cli train --epochs 2 --batch-size 16 --hidden-size 16 --seed 1337
          & .\.venv\Scripts\python.exe -m vfxai.cli test
